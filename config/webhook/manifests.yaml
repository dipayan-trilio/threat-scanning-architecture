---
# Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: threat-scanning-system
  labels:
    app.kubernetes.io/part-of: threat-scanning
---
# Service for webhook
apiVersion: v1
kind: Service
metadata:
  name: threat-scanning-webhook-service
  namespace: threat-scanning-system
spec:
  ports:
  - port: 443
    protocol: TCP
    targetPort: 9443
  selector:
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/component: webhook
---
# Cert-manager Issuer
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: threat-scanning-selfsigned-issuer
  namespace: threat-scanning-system
spec:
  selfSigned: {}
---
# Cert-manager Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: threat-scanning-webhook-cert
  namespace: threat-scanning-system
spec:
  secretName: threat-scanning-webhook-certs
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  subject:
    organizations:
    - trilio
  commonName: threat-scanning-webhook-service.threat-scanning-system.svc
  dnsNames:
  - threat-scanning-webhook-service
  - threat-scanning-webhook-service.threat-scanning-system
  - threat-scanning-webhook-service.threat-scanning-system.svc
  - threat-scanning-webhook-service.threat-scanning-system.svc.cluster.local
  issuerRef:
    name: threat-scanning-selfsigned-issuer
    kind: Issuer
---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-scanning-controller
  namespace: threat-scanning-system
  labels:
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: threat-scanning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: threat-scanning
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: threat-scanning
        app.kubernetes.io/component: webhook
        app.kubernetes.io/part-of: threat-scanning
    spec:
      serviceAccountName: trilio-threat-scanning
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
      - name: manager
        image: eu.gcr.io/amazing-chalice-243510/threat-scanning-controller:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --enable-webhook=true
        - --webhook-port=9443
        - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
        - --leader-elect=true
        env:
        - name: INSTALL_NAMESPACE
          value: "default"
        - name: PRODUCTION
          value: "false"
        - name: RELATED_IMAGE_VALIDATOR
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/datastore-attacher:v9.5"
        - name: RELATED_IMAGE_POLLER
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/datastore-attacher:v9.5"
        - name: RELATED_IMAGE_SCANNER
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/scan-engine:v1.6"
        - name: RELATED_IMAGE_JANITOR
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/janitor:v1.2"
        - name: RELATED_IMAGE_REDIS
          value: "redis:7-alpine"
        - name: TARGET_POLLING_DISABLED
          value: "true"
        - name: TARGET_POLLING_CRON
          value: "2 * * * *"
        - name: DATABASE_URL
          value: "sqlite+aiosqlite:///./scan_analysis.db"
        ports:
        - containerPort: 9443
          name: webhook
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: threat-scanning-webhook-certs
          optional: false
      terminationGracePeriodSeconds: 10
---
# Validating Webhook Configuration
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: threat-scanning-validating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: threat-scanning-system/threat-scanning-webhook-cert
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: threat-scanning-webhook-service
      namespace: threat-scanning-system
      path: /validate-threatscanning-trilio-io-v1-target
  failurePolicy: Fail
  name: vtarget.threatscanning.trilio.io
  rules:
  - apiGroups:
    - threatscanning.trilio.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - targets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: threat-scanning-webhook-service
      namespace: threat-scanning-system
      path: /validate-threatscanning-trilio-io-v1-scaninstance
  failurePolicy: Fail
  name: vscaninstance.threatscanning.trilio.io
  rules:
  - apiGroups:
    - threatscanning.trilio.io
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - scaninstances
  sideEffects: None
---
# Mutating Webhook Configuration
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: threat-scanning-mutating-webhook-configuration
  annotations:
    cert-manager.io/inject-ca-from: threat-scanning-system/threat-scanning-webhook-cert
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: threat-scanning-webhook-service
      namespace: threat-scanning-system
      path: /mutate-threatscanning-trilio-io-v1-target
  failurePolicy: Fail
  name: mtarget.threatscanning.trilio.io
  rules:
  - apiGroups:
    - threatscanning.trilio.io
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - targets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: threat-scanning-webhook-service
      namespace: threat-scanning-system
      path: /mutate-threatscanning-trilio-io-v1-scaninstance
  failurePolicy: Fail
  name: mscaninstance.threatscanning.trilio.io
  rules:
  - apiGroups:
    - threatscanning.trilio.io
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - scaninstances
  sideEffects: None
