---
apiVersion: v1
kind: Service
metadata:
  name: threat-scanning-webhook-service
  namespace: threat-scanning-system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: threat-scanning
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: threat-scanning-validating-webhook
  labels:
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/part-of: threat-scanning
  annotations:
    cert-manager.io/inject-ca-from: threat-scanning-system/webhook-server-cert
webhooks:
  - name: target-validation.threatscanning.trilio.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: threat-scanning-webhook-service
        namespace: threat-scanning-system
        path: /validate-threatscanning-trilio-io-v1-target
        port: 443
    failurePolicy: Fail
    matchPolicy: Equivalent
    namespaceSelector: {}
    objectSelector: {}
    rules:
      - apiGroups:
          - threatscanning.trilio.io
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - targets
        scope: "Cluster"
    sideEffects: None
    timeoutSeconds: 10

