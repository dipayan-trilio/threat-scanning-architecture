---
apiVersion: v1
kind: Namespace
metadata:
  name: threat-scanning-system
  labels:
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/part-of: threat-scanning
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: threat-scanning-webhook
  namespace: threat-scanning-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-scanning-webhook
  namespace: threat-scanning-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/part-of: threat-scanning
spec:
  replicas: 1
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: threat-scanning
  template:
    metadata:
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: threat-scanning
    spec:
      serviceAccountName: threat-scanning-webhook
      securityContext:
        runAsNonRoot: true
      containers:
      - name: manager
        image: eu.gcr.io/amazing-chalice-243510/threat-scanning-webhook:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --enable-webhook=true
        - --webhook-port=9443
        - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
        - --enable-leader-election=true
        ports:
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
      terminationGracePeriodSeconds: 10

