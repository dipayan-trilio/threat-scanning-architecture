apiVersion: apps/v1
kind: Deployment
metadata:
  name: threat-scanning-controller
  namespace: threat-scanning-system
  labels:
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/component: webhook
    app.kubernetes.io/part-of: threat-scanning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: threat-scanning
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: threat-scanning
        app.kubernetes.io/component: webhook
        app.kubernetes.io/part-of: threat-scanning
    spec:
      serviceAccountName: trilio-threat-scanning
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      # Init container generates certificates at startup (Trilio's approach)
      initContainers:
      - name: webhook-cert-init
        image: eu.gcr.io/amazing-chalice-243510/threat-scanning-controller:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --init-certs-only
        env:
        - name: INSTALL_NAMESPACE
          value: "threat-scanning-system"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
      containers:
      - name: manager
        image: eu.gcr.io/amazing-chalice-243510/threat-scanning-controller:latest
        imagePullPolicy: Always
        command:
        - /manager
        args:
        - --enable-webhook=true
        - --webhook-port=9443
        - --webhook-cert-dir=/tmp/k8s-webhook-server/serving-certs
        - --leader-elect=true
        env:
        - name: INSTALL_NAMESPACE
          value: "default"
        - name: PRODUCTION
          value: "false"
        - name: RELATED_IMAGE_VALIDATOR
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/datastore-attacher:v9.5"
        - name: RELATED_IMAGE_POLLER
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/datastore-attacher:v9.5"
        - name: RELATED_IMAGE_SCANNER
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/scan-engine:v1.6"
        - name: RELATED_IMAGE_JANITOR
          value: "eu.gcr.io/amazing-chalice-243510/threatscanning/janitor:v1.2"
        - name: RELATED_IMAGE_REDIS
          value: "redis:7-alpine"
        - name: TARGET_POLLING_DISABLED
          value: "true"
        - name: TARGET_POLLING_CRON
          value: "2 * * * *"
        - name: DATABASE_URL
          value: "sqlite+aiosqlite:///./scan_analysis.db"
        ports:
        - containerPort: 9443
          name: webhook
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: webhook-certs
          mountPath: /tmp/k8s-webhook-server/serving-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: threat-scanning-webhook-certs
          optional: true  # Secret will be created by init container
      terminationGracePeriodSeconds: 10
