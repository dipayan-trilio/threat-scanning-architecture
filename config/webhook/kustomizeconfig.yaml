# This file is for teaching kustomize how to substitute name, namespace reference and var substitution
nameReference:
  - kind: Service
    version: v1
    fieldSpecs:
      - kind: ValidatingWebhookConfiguration
        group: admissionregistration.k8s.io
        path: webhooks/clientConfig/service/name

namespace:
  - kind: Service
    version: v1
    fieldSpecs:
      - kind: ValidatingWebhookConfiguration
        group: admissionregistration.k8s.io
        path: webhooks/clientConfig/service/namespace

varReference:
  - path: metadata/annotations

