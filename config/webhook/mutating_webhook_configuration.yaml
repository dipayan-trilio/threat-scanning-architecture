apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: threat-scanning-mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: threat-scanning-webhook-service
      namespace: threat-scanning-system
      path: /mutate-threatscanning-trilio-io-v1-target
  failurePolicy: Fail
  name: mtarget.threatscanning.trilio.io
  rules:
  - apiGroups:
    - threatscanning.trilio.io
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - targets
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: threat-scanning-webhook-service
      namespace: threat-scanning-system
      path: /mutate-threatscanning-trilio-io-v1-scaninstance
  failurePolicy: Fail
  name: mscaninstance.threatscanning.trilio.io
  rules:
  - apiGroups:
    - threatscanning.trilio.io
    apiVersions:
    - v1
    operations:
    - CREATE
    resources:
    - scaninstances
  sideEffects: None
