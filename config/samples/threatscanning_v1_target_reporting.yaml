apiVersion: v1
kind: Secret
metadata:
  name: reporting-credentials
  namespace: threat-scanning-system
type: Opaque
stringData:
  accessKey: "YOUR_ACCESS_KEY"
  secretKey: "YOUR_SECRET_KEY"
---
apiVersion: threatscanning.trilio.io/v1
kind: Target
metadata:
  name: reporting-target
  annotations:
    trilio.io/reporting-target: "true"
  labels:
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/part-of: threat-scanning
spec:
  type: ObjectStore
  vendor: MinIO
  objectStoreCredentials:
    url: "https://minio.example.com:9000"
    bucketName: "threat-scan-reports"
    region: "us-east-1"
    credentialSecret:
      name: reporting-credentials
      namespace: threat-scanning-system
    skipCertVerification: true

