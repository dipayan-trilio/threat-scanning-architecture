---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: scaninstances.threatscanning.trilio.io
spec:
  group: threatscanning.trilio.io
  names:
    kind: ScanInstance
    listKind: ScanInstanceList
    plural: scaninstances
    shortNames:
    - si
    singular: scaninstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.backupTarget.name
      name: BackupTarget
      type: string
    - jsonPath: .spec.backupRef.path
      name: BackupPath
      type: string
    - jsonPath: .status.type
      name: Type
      type: string
    - jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: ScanInstance represents a single scan operation for a backup.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScanInstanceSpec defines the specification of a ScanInstance.
            properties:
              backupRef:
                description: BackupRef is the reference to the backup
                properties:
                  path:
                    description: Path is the path to the backup
                    type: string
                  uid:
                    description: UID is the UID of the backup
                    type: string
                required:
                - path
                type: object
              backupTarget:
                description: BackupTarget is the reference to the backup target
                properties:
                  apiVersion:
                    description: APIVersion is the API version of the target
                    type: string
                  kind:
                    description: Kind is the kind of the target
                    type: string
                  name:
                    description: Name is the name of the target
                    type: string
                  resourceVersion:
                    description: ResourceVersion is the resource version of the target
                    type: string
                  uid:
                    description: UID is the UID of the target
                    type: string
                required:
                - name
                type: object
            required:
            - backupRef
            - backupTarget
            type: object
          status:
            description: ScanInstanceStatusSpec defines the observed state of ScanInstance
            properties:
              condition:
                description: Condition is the current condition of a scan instance.
                items:
                  description: ScanInstanceCondition specifies the current condition
                    of a scan instance.
                  properties:
                    phase:
                      allOf:
                      - enum:
                        - Queued
                        - PreScan
                        - Scanning
                      - enum:
                        - Queued
                        - PreScan
                        - Scanning
                      description: Phase defines the current phase of the scan.
                      type: string
                    reason:
                      description: A brief message indicating details about why the
                        component is in this condition.
                      type: string
                    status:
                      allOf:
                      - enum:
                        - InProgress
                        - Available
                        - Unavailable
                        - Completed
                        - Failed
                      - enum:
                        - InProgress
                        - Completed
                        - Failed
                      description: Status is the status of the condition.
                      type: string
                    timestamp:
                      description: Timestamp is the time a condition occurred.
                      format: date-time
                      type: string
                  type: object
                type: array
              report:
                description: Report is the path to the scan report
                type: string
              scanLocations:
                description: |-
                  ScanLocations contains the list of backup locations to scan with their VM PVC paths
                  For single namespace backup: One entry with empty Namespace field
                  For cluster-backup: Multiple entries (one per child backup that has VMs)
                  If this list is empty, no VM workloads need scanning
                items:
                  description: ScanLocation represents a backup location with VMs
                    to scan
                  properties:
                    backupPath:
                      description: BackupPath is the relative path to the backup directory
                      type: string
                    backupUID:
                      description: BackupUID is the UID of the backup
                      type: string
                    namespace:
                      description: |-
                        Namespace is the namespace of the backup
                        Empty for single namespace backups (non-cluster)
                      type: string
                    vms:
                      description: |-
                        VMs contains the list of VMs with their PVC paths that need scanning
                        Each VM entry groups all PVCs belonging to that VM
                        For now, includes all VM PVCs (boot + data disks)
                        Future: Will be filtered to include only boot disks
                      items:
                        description: VMInfo contains information about a VM and its
                          PVCs that need scanning
                        properties:
                          pvcPaths:
                            description: |-
                              PVCPaths contains the list of PVC paths for this VM
                              For now, includes all VM PVCs (boot disk + data disks)
                              Future: Will be filtered to include only the boot disk
                            items:
                              type: string
                            type: array
                          vmName:
                            description: VMName is the name of the VirtualMachine
                            type: string
                        required:
                        - pvcPaths
                        - vmName
                        type: object
                      type: array
                  required:
                  - backupPath
                  - backupUID
                  - vms
                  type: object
                type: array
              status:
                allOf:
                - enum:
                  - Queued
                  - InProgress
                  - Completed
                  - Failed
                - enum:
                  - Queued
                  - InProgress
                  - Completed
                  - Failed
                description: Status is the overall status of the scan instance
                type: string
              type:
                allOf:
                - enum:
                  - TVK
                  - TVO
                - enum:
                  - TVK
                  - TVO
                description: Type is the type of backup (TVK or TVO)
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
