apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/part-of: threat-scanning
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: threat-scanning
    app.kubernetes.io/part-of: threat-scanning
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        image: controller:latest
        name: manager
        env:
        - name: SCAN_JOB_TIMEOUT_SECONDS
          value: "1500"
        - name: MAX_CONCURRENT_SCANS
          value: "5"
        - name: SCANJOB_CPU_REQUEST
          value: "500m"
        - name: SCANJOB_MEMORY_REQUEST
          value: "512Mi"
        # Optional: Set resource limits for scan jobs
        # If not set, scan jobs will have no resource limits
        # - name: SCANJOB_CPU_LIMIT
        #   value: "2000m"
        # - name: SCANJOB_MEMORY_LIMIT
        #   value: "2Gi"
        - name: POSTGRES_HOST
          value: "postgres-service.threat-scanning-system.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "postgres123"
        - name: POSTGRES_DASHBOARD_DATABASE
          value: "soc_dashboard"
        - name: POSTGRES_CACHE_DATABASE
          value: "soc_cache"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10

