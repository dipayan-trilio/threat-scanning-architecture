apiVersion: batch/v1
kind: CronJob
metadata:
  name: threat-scan-janitor
  namespace: system
  labels:
    app.kubernetes.io/name: threat-scan-janitor
    app.kubernetes.io/component: cleanup
    app.kubernetes.io/part-of: threat-scanning
    app.kubernetes.io/managed-by: kustomize
spec:
  # Run every 6 hours
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600  # Keep job for 1 hour after completion
      template:
        metadata:
          labels:
            app.kubernetes.io/name: threat-scan-janitor
            app.kubernetes.io/component: cleanup
        spec:
          serviceAccountName: controller-manager
          restartPolicy: OnFailure
          containers:
          - name: janitor
            image: janitor:latest
            imagePullPolicy: IfNotPresent
            command:
            - /app/janitor
            args:
            - --status=Failed
            - --threshold-minutes=4320  # 3 days default
            env:
            - name: INSTALL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
