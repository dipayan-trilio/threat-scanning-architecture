[pytest]
testpaths = targetPoller/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage options
addopts = 
    -v
    --tb=short
    --strict-markers

# Markers for categorizing tests
markers =
    unit: Unit tests with mocks (fast, no dependencies)
    integration: Integration tests (require K8s cluster via kind)
    envtest: EnvTest-style integration tests (real API server + etcd)
    cleanup: Tests for cleanup functionality
    discovery: Tests for discovery functionality
    workers: Tests for worker threads
    slow: Slow running tests
    e2e: End-to-end tests (full stack)

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
